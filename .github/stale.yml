# Number of days of inactivity before an issue becomes stale
daysUntilStale: 10
# Number of days of inactivity before a stale issue is closed
daysUntilClose: 10
# Issues with these labels will never be considered stale
exemptLabels:
  - pinned
  - security
# Label to use when marking an issue as stale
staleLabel: Stale
# Comment to post when marking an issue as stale. Set to `false` to disable
markComment: >
  Esta issue foi automaticamente marcado como estagnada por falta de
  actividade recente. Será fechada se nenhuma outra actividade ocorrer. Se o seu PR tiver um conflito de merge, terá de ser resolvido antes de ser feito o merge. Obrigado
  pelas suas contribuições.
# Comment to post when closing a stale issue. Set to `false` to disable
closeComment: >
  Esta issue foi automaticamente fechada por falta de actividade recente.
  Se o seu PR tiver um conflito de merge, terá de ser resolvido antes de ser feito o merge. Sinta-se à vontade para resolver o conflito e reabri-lo.
  Obrigado pelas suas contribuições.
